<!-- About Ashya Section -->
<section class="py-5 bg-beige">
  <div class="container">
    <div class="row align-items-center">

      <!-- Imagen -->
      <div class="col-lg-6 mb-4 mb-lg-0 text-center"
           appRevealAnimate="animate__fadeInLeft"
           [delay]="'0s'">
        <img
          src="assets/about/about.webp"
          alt="Ashya - Ceramics Artist"
          class="img-fluid rounded-4 shadow">
      </div>

      <!-- Texto -->
      <div class="col-lg-6 text-center text-lg-start"
          appRevealAnimate="animate__fadeInRight"
          [delay]="'0s'">

        <h2 class="fw-bold mb-4" style="color: #3E3028;">
          {{ 'ABOUT.TITLE' | translate }}
        </h2>

        <p class="fs-5" style="color:#6b5e52;">
          {{ 'ABOUT.P1' | translate }}
        </p>

        <p class="fs-5" style="color:#6b5e52;">
          {{ 'ABOUT.P2' | translate }}
        </p>

        <p class="fs-5" style="color:#6b5e52;">
          {{ 'ABOUT.P3' | translate }}
        </p>

        <p class="fs-5" style="color:#6b5e52;">
          {{ 'ABOUT.P4' | translate }}
        </p>

        <p class="fs-5" style="color:#6b5e52;">
          {{ 'ABOUT.P5' | translate }}
        </p>

        <p class="fw-bold fs-5" style="color: #3E3028;" [innerHTML]="'ABOUT.SIGNOFF' | translate">
        </p>

      </div>


    </div>
  </div>
</section>
