<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
    <h1 class="display-6 fw-semibold">Utils</h1>
  </div>

  <div class="card shadow-sm rounded-3" style="max-width: 640px;">
    <div class="card-body">
      <h5 class="card-title mb-1">Maintenance mode</h5>
      <p class="text-muted mb-3">
        When enabled, visitors to the public site are redirected to a maintenance page.
        You can still preview the live site using the maintenance password.
      </p>

      <div class="d-flex align-items-center justify-content-between">
        <div class="form-check form-switch fs-5 m-0">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="maintenanceSwitch"
            [checked]="mantenimientoActivo"
            [disabled]="loading || saving"
            (change)="toggleMantenimiento()"
          />
          <label class="form-check-label ms-2" for="maintenanceSwitch">
            {{ loading ? 'Loading…' : (mantenimientoActivo ? 'Maintenance is ON' : 'Maintenance is OFF') }}
          </label>
        </div>

        <span *ngIf="mantenimientoActivo" class="badge bg-warning text-dark">Site blocked</span>
        <span *ngIf="!mantenimientoActivo && !loading" class="badge bg-success">Site live</span>
      </div>
    </div>
  </div>
</div>

<app-feedback-modal
  *ngIf="mostrarFeedback"
  [title]="feedbackTitulo"
  [message]="feedbackMensaje"
  [status]="feedbackTipo"
  (closed)="cerrarFeedback()"
></app-feedback-modal>
