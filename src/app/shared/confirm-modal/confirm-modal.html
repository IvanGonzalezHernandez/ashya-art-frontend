<div class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle" aria-describedby="confirmModalDesc" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content border-0 shadow rounded">

      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="confirmModalTitle">{{ title }}</h5>
      </div>

      <div class="modal-body" id="confirmModalDesc">
        <p class="mb-0">{{ message }}</p>
      </div>

      <div class="modal-footer border-0">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelled.emit()">{{ cancelLabel }}</button>
        <button type="button" class="btn btn-danger" (click)="confirmed.emit()">{{ confirmLabel }}</button>
      </div>

    </div>
  </div>
</div>
